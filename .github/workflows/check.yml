name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate modules and confirm generated files are current
        run: python3 scripts/build-boot.py --check
